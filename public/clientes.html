<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreia - Clientes</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <a href="/dashboard.html" class="nav-logo"><img src="/img/logo-recobro.jpg" alt="Recobro"><div><div class="nav-brand">RASTREIA</div></div></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/novo-pedido.html">+ Novo Pedido</a>
    <a href="/restricoes.html">🚦 Restrições no CPF</a>
    <a href="/veicular.html">🚗 Consulta Veicular</a>
    <a href="/clientes.html" class="ativo">Clientes</a>
    <a href="#" onclick="logout()">Sair</a>
  </div>
  <div class="nav-user" id="nav-user"></div>
</nav>

<div class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <h1 class="page-title" style="margin:0">Clientes</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input type="text" id="busca" placeholder="Buscar por nome, CNPJ ou empresa..." style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;min-width:260px" oninput="debounceBusca()">
      <button class="btn btn-primary" onclick="abrirForm()">+ Novo Cliente</button>
    </div>
  </div>

  <div id="alerta"></div>

  <!-- Tabela de Clientes -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Lista de Clientes</span>
      <button class="btn btn-sm btn-outline" onclick="carregarClientes()">&#8635; Atualizar</button>
    </div>
    <div id="tabela-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>
</div>

<!-- Modal do Formulario -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:24px;max-width:600px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0;font-size:18px;color:#1a3a5c" id="form-titulo">Novo Cliente</h2>
      <button onclick="fecharForm()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6b7280">&times;</button>
    </div>
    <input type="hidden" id="form-id">
    <div class="form-grid">
      <div class="form-group full">
        <label>Nome *</label>
        <input type="text" id="f-nome" placeholder="Nome completo ou responsavel">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="email@empresa.com">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="tel" id="f-whatsapp" placeholder="(62) 99999-9999">
      </div>
      <div class="form-group">
        <label>CNPJ</label>
        <input type="text" id="f-cnpj" placeholder="00.000.000/0000-00">
      </div>
      <div class="form-group">
        <label>Empresa</label>
        <input type="text" id="f-empresa" placeholder="Razao Social">
      </div>
      <div class="form-group full">
        <label>Nicho</label>
        <input type="text" id="f-nicho" placeholder="Ex: Advocacia, Imobiliaria, Comercio">
      </div>
      <div class="form-group full">
        <label>Endereco</label>
        <input type="text" id="f-endereco" placeholder="Rua, numero, bairro, cidade - UF">
      </div>
      <div class="form-group full">
        <label>Observacoes</label>
        <textarea id="f-observacoes" rows="3" placeholder="Anotacoes sobre o cliente" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="fecharForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarCliente()">Salvar</button>
    </div>
  </div>
</div>

<div class="footer">
  Recobro Recuperacao de Credito | Anapolis - GO |
  <a href="/termos.html" target="_blank">Termos de Uso</a> |
  <a href="/privacidade.html" target="_blank">Privacidade</a>
</div>

<script>
  const token = localStorage.getItem('rastreia_token');
  if (!token) window.location.href = '/';
  const usuario = JSON.parse(localStorage.getItem('rastreia_usuario') || '{}');
  document.getElementById('nav-user').textContent = usuario.nome || '';

  function esc(str) { if (str == null) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  let buscaTimer = null;
  function debounceBusca() {
    clearTimeout(buscaTimer);
    buscaTimer = setTimeout(carregarClientes, 300);
  }

  async function apiJson(url, opts) {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, ...opts });
    if (res.status === 401) { logout(); return null; }
    return res.json();
  }

  async function carregarClientes() {
    const busca = document.getElementById('busca').value.trim();
    const url = '/api/clientes' + (busca ? '?busca=' + encodeURIComponent(busca) : '');
    const data = await apiJson(url);
    if (!data) return;
    const el = document.getElementById('tabela-content');
    if (!data.clientes || !data.clientes.length) {
      el.innerHTML = '<div class="loading">Nenhum cliente encontrado</div>';
      return;
    }
    el.innerHTML = `
      <table>
        <thead><tr>
          <th>Nome</th><th>Email</th><th>WhatsApp</th><th>Empresa</th><th>CNPJ</th><th>Nicho</th><th>Acoes</th>
        </tr></thead>
        <tbody>
          ${data.clientes.map(c => `
            <tr>
              <td><strong>${esc(c.nome)}</strong></td>
              <td>${esc(c.email) || '<span style="color:#9ca3af">-</span>'}</td>
              <td>${esc(c.whatsapp) || '<span style="color:#9ca3af">-</span>'}</td>
              <td>${esc(c.empresa) || '<span style="color:#9ca3af">-</span>'}</td>
              <td><code>${esc(c.cnpj) || '-'}</code></td>
              <td>${esc(c.nicho) || '<span style="color:#9ca3af">-</span>'}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-sm btn-outline" onclick="editarCliente('${c.id}')">Editar</button>
                <button class="btn btn-sm btn-outline" style="color:#dc2626;border-color:#dc2626" onclick="excluirCliente('${c.id}', '${esc(c.nome).replace(/'/g, "\\'")}')">Excluir</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function abrirForm(cliente) {
    document.getElementById('form-id').value = cliente ? cliente.id : '';
    document.getElementById('form-titulo').textContent = cliente ? 'Editar Cliente' : 'Novo Cliente';
    document.getElementById('f-nome').value = cliente ? cliente.nome || '' : '';
    document.getElementById('f-email').value = cliente ? cliente.email || '' : '';
    document.getElementById('f-whatsapp').value = cliente ? cliente.whatsapp || '' : '';
    document.getElementById('f-cnpj').value = cliente ? cliente.cnpj || '' : '';
    document.getElementById('f-empresa').value = cliente ? cliente.empresa || '' : '';
    document.getElementById('f-nicho').value = cliente ? cliente.nicho || '' : '';
    document.getElementById('f-endereco').value = cliente ? cliente.endereco || '' : '';
    document.getElementById('f-observacoes').value = cliente ? cliente.observacoes || '' : '';
    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = 'flex';
  }

  function fecharForm() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  async function salvarCliente() {
    const id = document.getElementById('form-id').value;
    const payload = {
      nome: document.getElementById('f-nome').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      whatsapp: document.getElementById('f-whatsapp').value.trim(),
      cnpj: document.getElementById('f-cnpj').value.trim(),
      empresa: document.getElementById('f-empresa').value.trim(),
      nicho: document.getElementById('f-nicho').value.trim(),
      endereco: document.getElementById('f-endereco').value.trim(),
      observacoes: document.getElementById('f-observacoes').value.trim()
    };
    if (!payload.nome) return alerta('Nome e obrigatorio', 'error');

    const url = id ? `/api/clientes/${id}` : '/api/clientes';
    const method = id ? 'PATCH' : 'POST';
    const data = await apiJson(url, { method, body: JSON.stringify(payload) });
    if (!data) return;
    if (data.erro) return alerta(data.erro, 'error');
    fecharForm();
    alerta(id ? 'Cliente atualizado com sucesso' : 'Cliente criado com sucesso', 'success');
    carregarClientes();
  }

  async function editarCliente(id) {
    const data = await apiJson(`/api/clientes/${id}`);
    if (!data || data.erro) return alerta('Erro ao carregar cliente', 'error');
    abrirForm(data);
  }

  async function excluirCliente(id, nome) {
    if (!confirm(`Deseja realmente excluir o cliente "${nome}"?`)) return;
    const data = await apiJson(`/api/clientes/${id}`, { method: 'DELETE' });
    if (!data) return;
    if (data.erro) return alerta(data.erro, 'error');
    alerta('Cliente excluido com sucesso', 'success');
    carregarClientes();
  }

  function alerta(msg, tipo) {
    document.getElementById('alerta').innerHTML = `<div class="alert alert-${tipo === 'error' ? 'error' : 'success'}">${esc(msg)}</div>`;
    setTimeout(() => { document.getElementById('alerta').innerHTML = ''; }, 4000);
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }

  // Fechar modal ao clicar fora
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) fecharForm();
  });

  carregarClientes();
</script>
<!-- ▼ AHW: aba lateral de Saúde das APIs (admin) — inline por regra do projeto (não criar JS/CSS separado) -->
<div id="ahw-root"></div>
<style>
#ahw-root{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:99990;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
#ahw-tab{position:absolute;right:0;top:50%;transform:translateY(-50%);display:flex;align-items:center;justify-content:center;
  background:#fff;border:1px solid #e2e8f0;border-right:0;border-radius:7px 0 0 7px;box-shadow:-1px 0 4px rgba(15,23,42,.06);
  width:13px;height:30px;cursor:pointer;opacity:.28;transition:opacity .2s ease,width .15s ease}
#ahw-tab:hover{opacity:1;width:17px}
#ahw-tab.ahw-alert{opacity:1;width:16px;border-color:#fdba74;animation:ahw-pulse 2s ease-in-out infinite}
@keyframes ahw-pulse{0%,100%{box-shadow:-1px 0 5px rgba(234,88,12,.2)}50%{box-shadow:-2px 0 14px rgba(234,88,12,.55)}}
#ahw-dot{width:8px;height:8px;border-radius:50%;background:#94a3b8;flex:none;transition:background .3s}
#ahw-badge{position:absolute;top:-6px;left:-6px;min-width:15px;height:15px;border-radius:8px;background:#dc2626;color:#fff;
  font-size:9px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 3px;box-shadow:0 1px 4px rgba(0,0,0,.35)}
#ahw-panel{position:absolute;right:22px;top:50%;transform:translateY(-50%) translateX(10px);width:236px;background:#fff;
  border:1px solid #e2e8f0;border-radius:12px;box-shadow:0 12px 34px rgba(15,23,42,.2);padding:13px 14px;opacity:0;visibility:hidden;
  transition:opacity .18s ease,transform .18s ease;pointer-events:none}
#ahw-panel.ahw-open{opacity:1;visibility:visible;transform:translateY(-50%) translateX(0);pointer-events:auto}
#ahw-panel h4{margin:0;font-size:13px;color:#0f172a;display:flex;align-items:center;gap:6px;font-weight:700}
#ahw-sub{font-size:11px;color:#94a3b8;margin:3px 0 9px}
.ahw-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid #f1f5f9;font-size:12px}
.ahw-row span.d{width:8px;height:8px;border-radius:50%;flex:none}
.ahw-row b{font-weight:600;color:#334155;flex:1;white-space:nowrap}
.ahw-row i{font-style:normal;font-size:11px;font-weight:600}
#ahw-actions{display:flex;gap:7px;margin-top:11px}
#ahw-actions button,#ahw-actions a{flex:1;text-align:center;font-size:11px;font-weight:600;padding:7px 8px;border-radius:8px;
  border:1px solid #e2e8f0;background:#f8fafc;color:#334155;cursor:pointer;text-decoration:none;box-sizing:border-box}
#ahw-actions button:hover,#ahw-actions a:hover{background:#eef2f7}
#ahw-actions button:disabled{opacity:.6;cursor:default}
</style>
<script>(function(){
  var token=localStorage.getItem('rastreia_token');
  var usuario={};try{usuario=JSON.parse(localStorage.getItem('rastreia_usuario')||'{}')}catch(e){}
  if(!token||usuario.perfil!=='admin')return; // visível só para admin logado
  var ST={operante:'#16a34a',sem_credito:'#ea580c',limite:'#d97706',token_invalido:'#dc2626',fora_do_ar:'#dc2626',nao_configurada:'#94a3b8',nao_testada:'#94a3b8'};
  var TXT={operante:'Operante',sem_credito:'Sem crédito',limite:'Limite',token_invalido:'Token inválido',fora_do_ar:'Fora do ar',nao_configurada:'Não config.',nao_testada:'Não testada'};
  var GERAL={operante:'#16a34a',atencao:'#d97706',sem_credito:'#ea580c',critico:'#dc2626'};
  var root=document.getElementById('ahw-root');
  root.innerHTML='<div id="ahw-panel"></div><div id="ahw-tab" title="Saúde das APIs"><span id="ahw-badge"></span><span id="ahw-dot"></span></div>';
  var tab=document.getElementById('ahw-tab'),dot=document.getElementById('ahw-dot'),badge=document.getElementById('ahw-badge'),panel=document.getElementById('ahw-panel');
  var aberto=false,ultimoGeral=null;
  function setOpen(v){aberto=v;panel.classList.toggle('ahw-open',v)}
  tab.addEventListener('click',function(e){e.stopPropagation();setOpen(!aberto)});
  panel.addEventListener('click',function(e){e.stopPropagation()});
  document.addEventListener('click',function(){if(aberto)setOpen(false)});
  function quando(iso){if(!iso)return'';var s=Math.floor((Date.now()-new Date(iso).getTime())/1000);if(s<0)return'agora';if(s<60)return'há '+s+'s';if(s<3600)return'há '+Math.floor(s/60)+'m';if(s<86400)return'há '+Math.floor(s/3600)+'h';return'há '+Math.floor(s/86400)+'d'}
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':t;return d.innerHTML}
  function render(r){
    var prob=r.apis.filter(function(a){return['sem_credito','limite','token_invalido','fora_do_ar'].indexOf(a.status)>=0});
    dot.style.background=GERAL[r.geral]||'#16a34a';
    var alerta=r.geral!=='operante';
    tab.classList.toggle('ahw-alert',alerta);
    if(prob.length){badge.textContent=prob.length;badge.style.display='flex'}else{badge.style.display='none'}
    var rows=r.apis.map(function(a){return '<div class="ahw-row"><span class="d" style="background:'+(ST[a.status]||'#94a3b8')+'"></span><b>'+esc(a.nome)+'</b><i style="color:'+(ST[a.status]||'#94a3b8')+'">'+esc(TXT[a.status]||a.status)+'</i></div>'}).join('');
    panel.innerHTML='<h4>🩺 Saúde das APIs</h4><div id="ahw-sub">'+(alerta?esc(prob.length+' provedor(es) com problema'):'Tudo operante')+' · '+esc(quando(r.geral_em))+'</div>'+rows+
      '<div id="ahw-actions"><button id="ahw-test">🔄 Testar</button><a href="/dashboard.html">Painel</a></div>';
    var b=document.getElementById('ahw-test');if(b)b.addEventListener('click',function(e){e.stopPropagation();testar()});
    if(alerta&&ultimoGeral==='operante')setOpen(true); // auto-abre só quando um problema NOVO surge
    ultimoGeral=r.geral;
  }
  function carregar(){fetch('/api/admin/placar-apis',{headers:{Authorization:'Bearer '+token}}).then(function(res){if(res.status===401||res.status===403){root.style.display='none';return null}return res.json()}).then(function(r){if(r&&r.apis)render(r)}).catch(function(){})}
  function testar(){var b=document.getElementById('ahw-test');if(b){b.disabled=true;b.textContent='…'}fetch('/api/admin/placar-apis/testar',{method:'POST',headers:{Authorization:'Bearer '+token}}).then(function(res){return res.json()}).then(function(r){if(r&&r.apis)render(r)}).catch(function(){})}
  carregar();setInterval(carregar,60000);
})();</script>
<!-- ▲ AHW -->
</body>
</html>
