<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreia - Clientes</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <a href="/dashboard.html" class="nav-logo"><img src="/img/logo-recobro.jpg" alt="Recobro"><div><div class="nav-brand">RASTREIA</div></div></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/novo-pedido.html">+ Novo Pedido</a>
    <a href="/restricoes.html">🚦 Restrições no CPF</a>
    <a href="/veicular.html">🚗 Consulta Veicular</a>
    <a href="/clientes.html" class="ativo">Clientes</a>
    <a href="#" onclick="logout()">Sair</a>
  </div>
  <div class="nav-user" id="nav-user"></div>
</nav>

<div class="container">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px">
    <h1 class="page-title" style="margin:0">Clientes</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input type="text" id="busca" placeholder="Buscar por nome, CNPJ ou empresa..." style="padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;min-width:260px" oninput="debounceBusca()">
      <button class="btn btn-primary" onclick="abrirForm()">+ Novo Cliente</button>
    </div>
  </div>

  <div id="alerta"></div>

  <!-- Tabela de Clientes -->
  <div class="card">
    <div class="card-header">
      <span class="card-title">Lista de Clientes</span>
      <button class="btn btn-sm btn-outline" onclick="carregarClientes()">&#8635; Atualizar</button>
    </div>
    <div id="tabela-content">
      <div class="loading"><div class="spinner"></div>Carregando...</div>
    </div>
  </div>
</div>

<!-- Modal do Formulario -->
<div id="modal-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;display:none;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:24px;max-width:600px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <h2 style="margin:0;font-size:18px;color:#1a3a5c" id="form-titulo">Novo Cliente</h2>
      <button onclick="fecharForm()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6b7280">&times;</button>
    </div>
    <input type="hidden" id="form-id">
    <div class="form-grid">
      <div class="form-group full">
        <label>Nome *</label>
        <input type="text" id="f-nome" placeholder="Nome completo ou responsavel">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="f-email" placeholder="email@empresa.com">
      </div>
      <div class="form-group">
        <label>WhatsApp</label>
        <input type="tel" id="f-whatsapp" placeholder="(62) 99999-9999">
      </div>
      <div class="form-group">
        <label>CNPJ</label>
        <input type="text" id="f-cnpj" placeholder="00.000.000/0000-00">
      </div>
      <div class="form-group">
        <label>Empresa</label>
        <input type="text" id="f-empresa" placeholder="Razao Social">
      </div>
      <div class="form-group full">
        <label>Nicho</label>
        <input type="text" id="f-nicho" placeholder="Ex: Advocacia, Imobiliaria, Comercio">
      </div>
      <div class="form-group full">
        <label>Endereco</label>
        <input type="text" id="f-endereco" placeholder="Rua, numero, bairro, cidade - UF">
      </div>
      <div class="form-group full">
        <label>Observacoes</label>
        <textarea id="f-observacoes" rows="3" placeholder="Anotacoes sobre o cliente" style="width:100%;padding:8px 12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;font-family:inherit;resize:vertical"></textarea>
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="fecharForm()">Cancelar</button>
      <button class="btn btn-primary" onclick="salvarCliente()">Salvar</button>
    </div>
  </div>
</div>

<!-- Modal de Plano Mensal -->
<div id="plano-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:1000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:24px;max-width:480px;width:95%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,0.3)">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <h2 style="margin:0;font-size:18px;color:#1a3a5c">Plano mensal</h2>
      <button onclick="fecharPlano()" style="background:none;border:none;font-size:24px;cursor:pointer;color:#6b7280">&times;</button>
    </div>
    <div id="plano-cliente-nome" style="color:#64748b;font-size:13px;margin-bottom:14px;font-weight:600"></div>
    <input type="hidden" id="plano-cliente-id">

    <div id="plano-uso" style="display:none;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:12px;margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-size:13px;color:#64748b">Uso deste mês</span>
        <span id="plano-uso-num" style="font-weight:800;font-size:15px;color:#0f172a"></span>
      </div>
      <div style="height:8px;background:#eef2f7;border-radius:4px;overflow:hidden;margin:8px 0"><div id="plano-uso-bar" style="height:100%;width:0;background:#16a34a;transition:width .2s"></div></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-sm btn-primary" onclick="debitarPlano()">&#10003; Registrar consulta (&minus;1)</button>
        <button class="btn btn-sm btn-outline" onclick="creditarPlano()">&#8617; Desfazer (+1)</button>
        <button class="btn btn-sm btn-outline" onclick="resetarPlano()">&#10227; Resetar ciclo</button>
      </div>
    </div>

    <div style="font-size:12px;font-weight:700;color:#475569;margin-bottom:6px">Modelo</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
      <button class="btn btn-sm btn-outline" onclick="aplicarPreset('Essencial',4,297)">Essencial · 4 · R$297</button>
      <button class="btn btn-sm btn-outline" onclick="aplicarPreset('Profissional',10,597)">Profissional · 10 · R$597</button>
      <button class="btn btn-sm btn-outline" onclick="aplicarPreset('Conta-chave',20,1200)">Conta-chave · 20 · R$1.200</button>
    </div>
    <div class="form-grid">
      <div class="form-group full"><label>Nome do plano</label><input type="text" id="plano-nome" placeholder="Ex: Profissional"></div>
      <div class="form-group"><label>Cota por mês</label><input type="number" id="plano-cota" min="0" placeholder="0"></div>
      <div class="form-group"><label>Mensalidade (R$)</label><input type="number" id="plano-valor" min="0" step="0.01" placeholder="0"></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:16px;justify-content:space-between;align-items:center">
      <button class="btn btn-outline" style="color:#dc2626;border-color:#dc2626" onclick="removerPlano()">Remover plano</button>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" onclick="fecharPlano()">Fechar</button>
        <button class="btn btn-primary" onclick="salvarPlano()">Salvar plano</button>
      </div>
    </div>
  </div>
</div>

<div class="footer">
  Recobro Recuperacao de Credito | Anapolis - GO |
  <a href="/termos.html" target="_blank">Termos de Uso</a> |
  <a href="/privacidade.html" target="_blank">Privacidade</a>
</div>

<script>
  const token = localStorage.getItem('rastreia_token');
  if (!token) window.location.href = '/';
  const usuario = JSON.parse(localStorage.getItem('rastreia_usuario') || '{}');
  document.getElementById('nav-user').textContent = usuario.nome || '';

  function esc(str) { if (str == null) return ''; const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }

  function planoBadge(c) {
    const cota = Number(c.plano_cota_mensal || 0);
    if (!cota) return '<span style="color:#9ca3af">—</span>';
    const usadas = Number(c.plano_consultas_usadas || 0);
    const rest = Math.max(cota - usadas, 0);
    const cor = usadas >= cota ? '#dc2626' : (rest <= Math.ceil(cota * 0.25) ? '#d97706' : '#16a34a');
    const pct = Math.min(100, Math.round(usadas / cota * 100));
    return `<div style="min-width:120px">
      <div style="font-size:12px;font-weight:600;color:#334155">${esc(c.plano_nome || 'Plano')} · ${usadas}/${cota}</div>
      <div style="height:5px;background:#eef2f7;border-radius:3px;overflow:hidden;margin-top:3px"><div style="height:100%;width:${pct}%;background:${cor}"></div></div>
    </div>`;
  }

  let buscaTimer = null;
  function debounceBusca() {
    clearTimeout(buscaTimer);
    buscaTimer = setTimeout(carregarClientes, 300);
  }

  async function apiJson(url, opts) {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, ...opts });
    if (res.status === 401) { logout(); return null; }
    return res.json();
  }

  async function carregarClientes() {
    const busca = document.getElementById('busca').value.trim();
    const url = '/api/clientes' + (busca ? '?busca=' + encodeURIComponent(busca) : '');
    const data = await apiJson(url);
    if (!data) return;
    const el = document.getElementById('tabela-content');
    if (!data.clientes || !data.clientes.length) {
      el.innerHTML = '<div class="loading">Nenhum cliente encontrado</div>';
      return;
    }
    el.innerHTML = `
      <table>
        <thead><tr>
          <th>Nome</th><th>Email</th><th>WhatsApp</th><th>Empresa</th><th>CNPJ</th><th>Nicho</th><th>Plano mensal</th><th>Acoes</th>
        </tr></thead>
        <tbody>
          ${data.clientes.map(c => `
            <tr>
              <td><strong>${esc(c.nome)}</strong></td>
              <td>${esc(c.email) || '<span style="color:#9ca3af">-</span>'}</td>
              <td>${esc(c.whatsapp) || '<span style="color:#9ca3af">-</span>'}</td>
              <td>${esc(c.empresa) || '<span style="color:#9ca3af">-</span>'}</td>
              <td><code>${esc(c.cnpj) || '-'}</code></td>
              <td>${esc(c.nicho) || '<span style="color:#9ca3af">-</span>'}</td>
              <td>${planoBadge(c)}</td>
              <td style="white-space:nowrap">
                <button class="btn btn-sm btn-outline" style="border-color:#2563eb;color:#2563eb" onclick="abrirPlano('${c.id}', '${esc(c.nome).replace(/'/g, "\\'")}')">Plano</button>
                <button class="btn btn-sm btn-outline" onclick="editarCliente('${c.id}')">Editar</button>
                <button class="btn btn-sm btn-outline" style="color:#dc2626;border-color:#dc2626" onclick="excluirCliente('${c.id}', '${esc(c.nome).replace(/'/g, "\\'")}')">Excluir</button>
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function abrirForm(cliente) {
    document.getElementById('form-id').value = cliente ? cliente.id : '';
    document.getElementById('form-titulo').textContent = cliente ? 'Editar Cliente' : 'Novo Cliente';
    document.getElementById('f-nome').value = cliente ? cliente.nome || '' : '';
    document.getElementById('f-email').value = cliente ? cliente.email || '' : '';
    document.getElementById('f-whatsapp').value = cliente ? cliente.whatsapp || '' : '';
    document.getElementById('f-cnpj').value = cliente ? cliente.cnpj || '' : '';
    document.getElementById('f-empresa').value = cliente ? cliente.empresa || '' : '';
    document.getElementById('f-nicho').value = cliente ? cliente.nicho || '' : '';
    document.getElementById('f-endereco').value = cliente ? cliente.endereco || '' : '';
    document.getElementById('f-observacoes').value = cliente ? cliente.observacoes || '' : '';
    const overlay = document.getElementById('modal-overlay');
    overlay.style.display = 'flex';
  }

  function fecharForm() {
    document.getElementById('modal-overlay').style.display = 'none';
  }

  async function salvarCliente() {
    const id = document.getElementById('form-id').value;
    const payload = {
      nome: document.getElementById('f-nome').value.trim(),
      email: document.getElementById('f-email').value.trim(),
      whatsapp: document.getElementById('f-whatsapp').value.trim(),
      cnpj: document.getElementById('f-cnpj').value.trim(),
      empresa: document.getElementById('f-empresa').value.trim(),
      nicho: document.getElementById('f-nicho').value.trim(),
      endereco: document.getElementById('f-endereco').value.trim(),
      observacoes: document.getElementById('f-observacoes').value.trim()
    };
    if (!payload.nome) return alerta('Nome e obrigatorio', 'error');

    const url = id ? `/api/clientes/${id}` : '/api/clientes';
    const method = id ? 'PATCH' : 'POST';
    const data = await apiJson(url, { method, body: JSON.stringify(payload) });
    if (!data) return;
    if (data.erro) return alerta(data.erro, 'error');
    fecharForm();
    alerta(id ? 'Cliente atualizado com sucesso' : 'Cliente criado com sucesso', 'success');
    carregarClientes();
  }

  async function editarCliente(id) {
    const data = await apiJson(`/api/clientes/${id}`);
    if (!data || data.erro) return alerta('Erro ao carregar cliente', 'error');
    abrirForm(data);
  }

  async function excluirCliente(id, nome) {
    if (!confirm(`Deseja realmente excluir o cliente "${nome}"?`)) return;
    const data = await apiJson(`/api/clientes/${id}`, { method: 'DELETE' });
    if (!data) return;
    if (data.erro) return alerta(data.erro, 'error');
    alerta('Cliente excluido com sucesso', 'success');
    carregarClientes();
  }

  function alerta(msg, tipo) {
    document.getElementById('alerta').innerHTML = `<div class="alert alert-${tipo === 'error' ? 'error' : 'success'}">${esc(msg)}</div>`;
    setTimeout(() => { document.getElementById('alerta').innerHTML = ''; }, 4000);
  }

  // ─── Plano mensal do cliente ───
  async function abrirPlano(id, nome) {
    document.getElementById('plano-cliente-id').value = id;
    document.getElementById('plano-cliente-nome').textContent = nome || '';
    const s = await apiJson(`/api/clientes/${id}/plano`);
    preencherPlano(s);
    document.getElementById('plano-overlay').style.display = 'flex';
  }
  function preencherPlano(s) {
    if (!s || s.erro) s = { cota_mensal: 0, consultas_usadas: 0, restantes: 0, valor_mensal: 0, plano_nome: '' };
    document.getElementById('plano-nome').value = s.plano_nome || '';
    document.getElementById('plano-cota').value = s.cota_mensal || '';
    document.getElementById('plano-valor').value = s.valor_mensal || '';
    const uso = document.getElementById('plano-uso');
    if (Number(s.cota_mensal) > 0) {
      uso.style.display = '';
      document.getElementById('plano-uso-num').textContent = `${s.consultas_usadas}/${s.cota_mensal}  (restam ${s.restantes})`;
      const pct = Math.min(100, Math.round((s.consultas_usadas / s.cota_mensal) * 100));
      const bar = document.getElementById('plano-uso-bar');
      bar.style.width = pct + '%';
      bar.style.background = s.restantes <= 0 ? '#dc2626' : (s.restantes <= Math.ceil(s.cota_mensal * 0.25) ? '#d97706' : '#16a34a');
    } else {
      uso.style.display = 'none';
    }
  }
  function fecharPlano() { document.getElementById('plano-overlay').style.display = 'none'; carregarClientes(); }
  function aplicarPreset(nome, cota, valor) {
    document.getElementById('plano-nome').value = nome;
    document.getElementById('plano-cota').value = cota;
    document.getElementById('plano-valor').value = valor;
  }
  async function salvarPlano() {
    const id = document.getElementById('plano-cliente-id').value;
    const body = {
      plano_nome: document.getElementById('plano-nome').value.trim(),
      cota_mensal: parseInt(document.getElementById('plano-cota').value, 10) || 0,
      valor_mensal: parseFloat(document.getElementById('plano-valor').value) || 0
    };
    const s = await apiJson(`/api/clientes/${id}/plano`, { method: 'PATCH', body: JSON.stringify(body) });
    if (!s) return;
    if (s.erro) return alerta(s.erro, 'error');
    preencherPlano(s);
    alerta('Plano salvo', 'success');
  }
  async function removerPlano() {
    if (!confirm('Remover o plano deste cliente?')) return;
    const id = document.getElementById('plano-cliente-id').value;
    const s = await apiJson(`/api/clientes/${id}/plano`, { method: 'PATCH', body: JSON.stringify({ cota_mensal: 0, valor_mensal: 0, plano_nome: '' }) });
    if (s && !s.erro) { preencherPlano(s); alerta('Plano removido', 'success'); }
  }
  async function debitarPlano() {
    const id = document.getElementById('plano-cliente-id').value;
    const s = await apiJson(`/api/clientes/${id}/plano/debitar`, { method: 'POST' });
    if (!s) return;
    if (s.erro) { alerta(s.erro, 'error'); if (s.status) preencherPlano(s.status); return; }
    preencherPlano(s);
  }
  async function creditarPlano() {
    const id = document.getElementById('plano-cliente-id').value;
    const s = await apiJson(`/api/clientes/${id}/plano/creditar`, { method: 'POST' });
    if (s && !s.erro) preencherPlano(s);
  }
  async function resetarPlano() {
    if (!confirm('Zerar o contador deste mês para este cliente?')) return;
    const id = document.getElementById('plano-cliente-id').value;
    const s = await apiJson(`/api/clientes/${id}/plano/resetar`, { method: 'POST' });
    if (s && !s.erro) { preencherPlano(s); alerta('Ciclo zerado', 'success'); }
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }

  // Fechar modal ao clicar fora
  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) fecharForm();
  });
  document.getElementById('plano-overlay').addEventListener('click', function(e) {
    if (e.target === this) fecharPlano();
  });

  carregarClientes();
</script>
</body>
</html>
