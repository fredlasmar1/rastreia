<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rastreia - Pedido</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<nav class="nav">
  <a href="/dashboard.html" class="nav-logo"><img src="/img/logo-recobro.jpg" alt="Recobro"><div><div class="nav-brand">RASTREIA</div></div></a>
  <div class="nav-links">
    <a href="/dashboard.html">Dashboard</a>
    <a href="/novo-pedido.html">+ Novo Pedido</a>
    <a href="/restricoes.html">🚦 Restrições no CPF</a>
    <a href="/clientes.html">Clientes</a>
    <a href="/revisao-contratos.html">⚖ Revisão de Contratos</a>
    <a href="#" onclick="logout()">Sair</a>
  </div>
  <div class="nav-user" id="nav-user"></div>
</nav>

<div class="container" style="max-width:800px">
  <div id="conteudo">
    <div class="loading"><div class="spinner"></div>Carregando pedido...</div>
  </div>
  <div class="card" id="revisao-box" hidden style="padding:18px;margin-top:16px"></div>
  <div class="card" id="locacao-box" hidden style="padding:18px;margin-top:16px"></div>
  <div class="card" style="padding:18px;margin-top:16px;border:1px solid #c7d2fe;background:#eef2ff;border-left:4px solid #1a3a8a" id="proximo-degrau" hidden></div>
</div>

<script>
  const token = localStorage.getItem('rastreia_token');
  if (!token) window.location.href = '/';
  const usuario = JSON.parse(localStorage.getItem('rastreia_usuario') || '{}');
  document.getElementById('nav-user').textContent = usuario.nome || '';

  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) window.location.href = '/dashboard.html';

  const TIPOS = {
    dossie_pf: 'Dossiê Pessoa Física', analise_inquilino: 'Análise de Inquilino', dossie_pj: 'Dossiê Pessoa Jurídica',
    due_diligence: 'Due Diligence Empresarial', due_diligence_imobiliaria: 'Due Diligence Imobiliária',
    analise_devedor: 'Análise de Devedor', investigacao_patrimonial: 'Investigação Patrimonial',
    consulta_veicular: 'Consulta Veicular'
  };

  const STATUS_IA_LABEL = {
    pendente: { txt: 'Pendente', cor: '#ea580c', bg: '#fef3c7' },
    concluida: { txt: 'Concluída', cor: '#065f46', bg: '#dcfce7' },
    falhou: { txt: 'Falhou', cor: '#dc2626', bg: '#fee2e2' },
    desabilitada: { txt: 'Desabilitada', cor: '#6b7280', bg: '#f3f4f6' },
    aguardando_extracao: { txt: 'Aguardando IA', cor: '#1e3a8a', bg: '#dbeafe' },
    cpf_ilegivel: { txt: 'CPF ilegível', cor: '#92400e', bg: '#fef3c7' }
  };

  const STATUS_LABEL = {
    aguardando_pagamento: 'Aguardando Pagamento', pago: 'Pago',
    em_andamento: 'Em Andamento', concluido: 'Concluído', cancelado: 'Cancelado'
  };

  async function api(url, opts = {}) {
    const res = await fetch(url, { headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' }, ...opts });
    if (res.status === 401) { logout(); return null; }
    return res.json();
  }

  function esc(str) { if (!str) return ''; const d = document.createElement('div'); d.textContent = String(str); return d.innerHTML; }

  let pedidoAtual;
  // Trava em memória: enquanto /consultar está em voo, não deixamos o operador
  // disparar /concluir (causava PDF gerado antes das APIs terminarem).
  let consultasEmAndamento = false;

  async function carregar() {
    const data = await api(`/api/pedidos/${id}`);
    if (!data || data.erro) { document.getElementById('conteudo').innerHTML = '<div class="alert alert-error">Pedido não encontrado</div>'; return; }
    pedidoAtual = data;
    renderizar(data);
    renderLocacao(data);
    if (data.tipo === 'revisao_contrato_bancario') carregarRevisao(data.id);
    if ((data.dados || []).length) carregarProximoDegrau(data.id);
    if (usuario.perfil === 'admin' || usuario.perfil === 'operador') carregarCusto(data);
    if (usuario.perfil === 'admin') carregarCustoAdmin(data);
  }

  // ── Revisão de Contrato Bancário: painel por etapa ─────────────────────
  // Conferência (entrega 4). Cálculo e revisão jurídica entram nas entregas 5 e 6.
  const RB_ETAPAS = { aguardando_documentos: 'Aguardando contrato', extraindo: 'Lendo o contrato (IA)…', conferencia_operador: 'Conferência do operador', calculando: 'Calculando', revisao_juridica: 'Revisão jurídica', aprovado: 'Aprovado', reprovado_juridico: 'Devolvido pelo jurídico' };
  const RB_CAMPOS = [
    ['Contrato', [
      ['instituicao.nome', 'Banco credor'], ['instituicao.cnpj', 'CNPJ do banco'],
      ['contratante.nome', 'Contratante'], ['contratante.cpf_cnpj', 'CPF/CNPJ do contratante'],
      ['pfpj', 'Pessoa', 'select', ['PF', 'PJ']],
      ['tipo_operacao', 'Tipo de operação', 'select', ['', 'financiamento_veiculo', 'emprestimo_pessoal', 'consignado', 'ccb_capital_giro', 'cartao_credito', 'cheque_especial', 'financiamento_imobiliario', 'outro']],
      ['subtipo', 'Subtipo (consignado: inss/publico/privado)', 'select', ['', 'inss', 'publico', 'privado', 'parcelado', 'ate_365']],
      ['operacao.numero_contrato', 'Nº do contrato'], ['operacao.data_contratacao', 'Data da contratação', 'date'],
      ['operacao.data_primeiro_vencimento', '1º vencimento', 'date'],
      ['situacao', 'Situação', 'select', ['', 'em_dia', 'atrasado', 'busca_apreensao', 'executado', 'quitado']],
      ['parcelas_pagas', 'Parcelas pagas', 'number']
    ]],
    ['Valores e taxas', [
      ['operacao.valor_liberado', 'Valor liberado (R$)', 'number'], ['operacao.valor_financiado_total', 'Valor financiado total (R$)', 'number'],
      ['operacao.prazo_meses', 'Prazo (meses)', 'number'], ['operacao.valor_parcela', 'Parcela (R$)', 'number'],
      ['operacao.sistema_amortizacao', 'Sistema', 'select', ['nao_informado', 'price', 'sac', 'outro']],
      ['operacao.taxa_juros_mensal_declarada', 'Taxa mensal declarada (%)', 'number'], ['operacao.taxa_juros_anual_declarada', 'Taxa anual declarada (%)', 'number'],
      ['operacao.cet_mensal', 'CET mensal (%)', 'number'], ['operacao.cet_anual', 'CET anual (%)', 'number'],
      ['operacao.capitalizacao_expressa', 'Capitalização expressa?', 'bool'], ['operacao.clausula_capitalizacao_trecho', 'Trecho da capitalização', 'text'],
      ['iof.valor', 'IOF (R$)', 'number'], ['iof.financiado', 'IOF financiado?', 'bool']
    ]],
    ['Garantia e mora', [
      ['garantia.tipo', 'Garantia', 'select', ['', 'alienacao_fiduciaria', 'consignacao', 'aval', 'nenhuma', 'outro']], ['garantia.bem_descricao', 'Bem'],
      ['encargos_mora.juros_mora', 'Juros de mora (% a.m.)', 'number'], ['encargos_mora.multa_percentual', 'Multa (%)', 'number'],
      ['encargos_mora.comissao_permanencia', 'Comissão de permanência?', 'bool'], ['encargos_mora.comissao_permanencia_cumulada', 'Cumulada com outros encargos?', 'bool'],
      ['encargos_mora.trecho', 'Trecho dos encargos', 'text']
    ]]
  ];
  let rbEstado = null;
  const rbGet = (o, p) => p.split('.').reduce((a, k) => (a == null ? a : a[k]), o);
  const rbSet = (o, p, v) => { const ks = p.split('.'); let a = o; ks.slice(0, -1).forEach(k => { if (a[k] == null || typeof a[k] !== 'object') a[k] = {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };
  async function carregarRevisao(id) {
    const box = document.getElementById('revisao-box');
    try {
      const r = await fetch(`/api/revisao-bancaria/${id}`, { headers: { Authorization: `Bearer ${localStorage.getItem('rastreia_token')}` } });
      if (!r.ok) { box.hidden = true; return; }
      rbEstado = await r.json();
      rbEstado.original = JSON.parse(JSON.stringify(rbEstado.campos));
      renderRevisao();
    } catch (_) { box.hidden = true; }
  }
  function rbConfianca(path) {
    const c = rbEstado.confianca || {}; const folha = path.split('.').pop();
    return c[path] || c[folha] || null;
  }
  function rbPagina(path) {
    const folha = path.split('.').pop();
    const p = (rbEstado.paginas || []).find(x => x.campo === path || x.campo === folha);
    return p && p.pagina ? `pág. ${p.pagina}` : '';
  }
  function rbInput(path, label, tipo, opts) {
    const v = rbGet(rbEstado.campos, path);
    const conf = rbConfianca(path);
    const editado = (rbEstado.campos.campos_editados || []).includes(path);
    const estilo = conf === 'baixa' ? 'background:#fef9c3;border-color:#eab308' : '';
    const id = 'rb-' + path.replace(/\./g, '-');
    let campo;
    if (tipo === 'select') campo = `<select id="${id}" data-path="${path}" style="width:100%;${estilo}">${opts.map(o => `<option value="${o}" ${String(v ?? '') === o ? 'selected' : ''}>${o || '—'}</option>`).join('')}</select>`;
    else if (tipo === 'bool') campo = `<select id="${id}" data-path="${path}" data-tipo="bool" style="width:100%;${estilo}"><option value="" ${v == null ? 'selected' : ''}>—</option><option value="true" ${v === true ? 'selected' : ''}>Sim</option><option value="false" ${v === false ? 'selected' : ''}>Não</option></select>`;
    else if (tipo === 'text') campo = `<textarea id="${id}" data-path="${path}" rows="2" style="width:100%;${estilo}">${esc(v ?? '')}</textarea>`;
    else campo = `<input id="${id}" data-path="${path}" data-tipo="${tipo || 'text'}" type="${tipo === 'date' ? 'date' : 'text'}" inputmode="${tipo === 'number' ? 'decimal' : 'text'}" value="${esc(v ?? '')}" style="width:100%;${estilo}">`;
    return `<label style="font-size:12px;display:block">${esc(label)}${conf ? ` <span style="color:${conf === 'baixa' ? '#a16207' : '#6b7280'}">(${conf})</span>` : ''}${rbPagina(path) ? ` <span style="color:#6b7280">${rbPagina(path)}</span>` : ''}${editado ? ' <span style="color:#1d4ed8">✎ conferido manualmente</span>' : ''}${campo}</label>`;
  }
  function rbLista(nome, itens, chaveFin) {
    return `<div style="margin-top:10px"><div style="font-weight:600;font-size:13px">${nome}</div>${(itens || []).map((it, i) => `
      <div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr) auto;gap:6px;align-items:end;margin-top:6px">
        <label style="font-size:12px">Nome<input data-lista="${nome}" data-i="${i}" data-k="${nome === 'Seguros' ? 'tipo' : 'nome'}" value="${esc(it.nome || it.tipo || '')}" style="width:100%"></label>
        <label style="font-size:12px">Valor (R$)<input data-lista="${nome}" data-i="${i}" data-k="valor" inputmode="decimal" value="${esc(it.valor ?? '')}" style="width:100%"></label>
        <label style="font-size:12px">Financiado<select data-lista="${nome}" data-i="${i}" data-k="${chaveFin}"><option value="true" ${it[chaveFin] ? 'selected' : ''}>Sim</option><option value="false" ${!it[chaveFin] ? 'selected' : ''}>Não</option></select></label>
      </div>${it.trecho ? `<div style="font-size:11px;color:#6b7280;margin-top:2px">“${esc(it.trecho)}”</div>` : ''}`).join('') || '<div style="font-size:12px;color:#6b7280">Nenhum.</div>'}
      <button type="button" class="btn btn-sm btn-outline" style="margin-top:6px" onclick="rbAddItem('${nome}')">+ adicionar</button></div>`;
  }
  function rbAddItem(nome) {
    rbColetar();
    const k = nome === 'Seguros' ? 'seguros' : 'tarifas';
    rbEstado.campos[k] = [...(rbEstado.campos[k] || []), nome === 'Seguros' ? { tipo: '', valor: null, financiado: true } : { nome: '', valor: null, financiada: true }];
    renderRevisao();
  }
  function renderRevisao() {
    const box = document.getElementById('revisao-box'); const e = rbEstado;
    const conferindo = ['conferencia_operador', 'aguardando_documentos', 'reprovado_juridico', 'calculando'].includes(e.etapa);
    let h = `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center">
      <div style="font-weight:800;font-size:16px">🏦 Revisão de Contrato Bancário</div>
      <span class="badge" style="background:#e0e7ff;color:#1e3a8a">${esc(RB_ETAPAS[e.etapa] || e.etapa)}</span></div>
      <div style="font-size:13px;color:#4b5563;margin:6px 0 10px">Documentos: ${e.documentos.map(d => `${esc(d.filename)}${d.tipo ? ` <em>(${esc(d.tipo)})</em>` : ''}`).join(' · ') || '<strong style="color:#b91c1c">nenhum — envie o contrato</strong>'}</div>`;
    if (e.alertas_leitura.length) h += `<div class="alert alert-warning" style="font-size:13px">Alertas da leitura: <ul style="margin:4px 0 0 18px">${e.alertas_leitura.map(a => `<li>${esc(a)}</li>`).join('')}</ul></div>`;
    if (e.etapa === 'extraindo') h += `<div style="font-size:14px">A IA está lendo o contrato. Atualize em alguns instantes.</div>`;
    if (conferindo) {
      RB_CAMPOS.forEach(([grupo, campos]) => {
        h += `<div style="font-weight:700;margin:12px 0 6px">${grupo}</div><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px">${campos.map(c => rbInput(c[0], c[1], c[2], c[3])).join('')}</div>`;
      });
      h += rbLista('Tarifas', e.campos.tarifas, 'financiada') + rbLista('Seguros', e.campos.seguros, 'financiado');
      h += `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn btn-outline" onclick="rbSalvar(false)">Salvar</button>
        <button class="btn btn-primary" onclick="rbSalvar(true)">✓ Confirmar dados</button>
        ${e.documentos.length ? `<button class="btn btn-outline" onclick="rbReextrair()">↻ Ler o contrato de novo (IA)</button>` : ''}
        <span id="rb-msg" style="font-size:13px;align-self:center"></span></div>`;
    }
    if (typeof renderRevisaoResultado === 'function') h += renderRevisaoResultado(e);
    box.innerHTML = h; box.hidden = false;
  }
  function rbColetar() {
    const c = rbEstado.campos; const orig = rbEstado.original; const editados = new Set(c.campos_editados || []);
    document.querySelectorAll('#revisao-box [data-path]').forEach(el => {
      const p = el.dataset.path; let v = el.value;
      if (el.dataset.tipo === 'bool') v = v === '' ? null : v === 'true';
      else if (el.dataset.tipo === 'number') { const t = String(v).replace(/[^\d,.-]/g, ''); v = t === '' ? null : Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); if (!Number.isFinite(v)) v = null; }
      else if (v === '') v = null;
      if (JSON.stringify(v ?? null) !== JSON.stringify(rbGet(orig, p) ?? null)) editados.add(p);
      rbSet(c, p, v);
    });
    document.querySelectorAll('#revisao-box [data-lista]').forEach(el => {
      const k = el.dataset.lista === 'Seguros' ? 'seguros' : 'tarifas'; const i = Number(el.dataset.i); const campo = el.dataset.k;
      let v = el.value; if (campo === 'valor') { const t = v.replace(/[^\d,.-]/g, ''); v = t === '' ? null : Number(t.includes(',') ? t.replace(/\./g, '').replace(',', '.') : t); }
      if (campo === 'financiada' || campo === 'financiado') v = v === 'true';
      c[k][i] = { ...c[k][i], [campo]: v };
    });
    if (JSON.stringify(c.tarifas) !== JSON.stringify(orig.tarifas)) editados.add('tarifas');
    if (JSON.stringify(c.seguros) !== JSON.stringify(orig.seguros)) editados.add('seguros');
    c.campos_editados = [...editados];
  }
  async function rbSalvar(confirmar) {
    rbColetar();
    const msg = document.getElementById('rb-msg'); msg.style.color = '#374151'; msg.textContent = confirmar ? 'Confirmando e calculando…' : 'Salvando…';
    const r = await fetch(`/api/revisao-bancaria/${rbEstado.pedido.id}/conferencia`, { method: 'PUT', headers: { Authorization: `Bearer ${localStorage.getItem('rastreia_token')}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ dados: rbEstado.campos, confirmar }) });
    const j = await r.json();
    if (!r.ok) { msg.style.color = '#b91c1c'; msg.textContent = j.erro || 'Erro ao salvar'; return; }
    await carregarRevisao(rbEstado.pedido.id);
  }
  async function rbReextrair() {
    const msg = document.getElementById('rb-msg'); msg.textContent = 'Lendo o contrato…';
    await fetch(`/api/revisao-bancaria/${rbEstado.pedido.id}/extrair`, { method: 'POST', headers: { Authorization: `Bearer ${localStorage.getItem('rastreia_token')}` } });
    await carregarRevisao(rbEstado.pedido.id);
  }

  // Resultado do cálculo + revisão jurídica (entrega 5)
  const rbBrl = (v) => v == null ? '—' : 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const rbPct = (v, d = 2) => v == null ? '—' : (Number(v) * 100).toFixed(d).replace('.', ',') + '%';
  const RB_VER = { forte: ['#dcfce7', '#14532d', 'FORTE'], moderada: ['#fef9c3', '#713f12', 'MODERADA'], fraca: ['#ffedd5', '#7c2d12', 'FRACA'], inviavel: ['#e5e7eb', '#1f2937', 'INVIÁVEL'] };
  const RB_RES = { aplicavel: ['#dcfce7', '#14532d', 'Aplicável'], verificar: ['#fef9c3', '#713f12', 'Verificar'], nao_aplicavel: ['#f3f4f6', '#4b5563', 'Não aplicável'] };
  function renderRevisaoResultado(e) {
    let h = '';
    const tx = e.taxa_media_bacen;
    if (e.etapa === 'calculando' && tx && tx.aguardando_taxa_manual) {
      h += `<div class="alert alert-warning" style="margin-top:12px;font-size:14px"><strong>O Banco Central não respondeu.</strong> ${esc(tx.erro || '')}<br>Informe a taxa média do mês da contratação (site do BACEN) para seguir; o laudo mostrará a origem "manual".
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="rb-tx-v" placeholder="% a.m. (ex 2,08)" inputmode="decimal" style="width:130px"><input id="rb-tx-m" placeholder="mês AAAA-MM" style="width:120px"><input id="rb-tx-f" placeholder="fonte (série/URL)" style="flex:1;min-width:160px"><button class="btn btn-primary btn-sm" onclick="rbTaxaManual()">Usar esta taxa</button></div></div>`;
    }
    const c = e.calculo;
    if (c && ['revisao_juridica', 'aprovado'].includes(e.etapa)) {
      const v = RB_VER[c.veredito?.nivel] || RB_VER.inviavel;
      const cp = c.cenario_principal ? c.cenarios[c.cenario_principal] : null;
      h += `<div style="margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px">
        <div style="background:${v[0]};color:${v[1]};border-radius:10px;padding:12px"><div style="font-size:11px;font-weight:700">VEREDITO</div><div style="font-size:22px;font-weight:800">${v[2]}</div><div style="font-size:12px">${esc(c.veredito?.motivo || '')}</div></div>
        <div style="border:1px solid #e5e7eb;border-radius:10px;padding:12px"><div style="font-size:11px;color:#6b7280">Taxa contratada (efetiva)</div><div style="font-size:18px;font-weight:700">${rbPct(c.taxa.efetiva_am, 4)} a.m.</div><div style="font-size:12px">${rbPct(c.taxa.efetiva_aa)} a.a.${c.taxa.declarada_am != null ? ` · declarada ${rbPct(c.taxa.declarada_am, 4)}` : ''}</div></div>
        <div style="border:1px solid #e5e7eb;border-radius:10px;padding:12px"><div style="font-size:11px;color:#6b7280">Média BACEN ${esc(tx?.mes_referencia || '')} ${tx?.origem === 'manual' ? '(manual)' : `(série ${tx?.serie_am || '?'})`}</div><div style="font-size:18px;font-weight:700">${c.bacen ? rbPct(c.bacen.am, 4) : '—'} a.m.</div><div style="font-size:12px">razão ${c.razao != null ? c.razao.toFixed(2).replace('.', ',') + '×' : '—'}${tx?.olinda?.banco ? ` · ${esc(tx.olinda.banco.nome)} ${tx.olinda.banco.posicao}º de ${tx.olinda.total_instituicoes}` : ''}</div></div>
        <div style="border:1px solid #e5e7eb;border-radius:10px;padding:12px"><div style="font-size:11px;color:#6b7280">Economia estimada (cenário ${esc(c.cenario_principal || '—')})</div><div style="font-size:18px;font-weight:700">${rbBrl(c.economia_estimada)}</div><div style="font-size:12px">${c.veredito?.economia_pct != null ? c.veredito.economia_pct.toFixed(1).replace('.', ',') + '% do financiado' : ''}</div></div>
      </div>`;
      if (c.valor_incontroverso) h += `<div style="margin-top:8px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:10px 12px;font-size:13px"><strong>Valor incontroverso (CPC art. 330, § 2º):</strong> ${rbBrl(c.valor_incontroverso.parcela_mensal)} por mês — o que o cliente reconhece e segue pagando; saldo revisado ${rbBrl(c.valor_incontroverso.saldo_devedor_revisado)}, ${c.valor_incontroverso.parcelas_restantes} parcela(s) restante(s).</div>`;
      if (c.alertas?.length) h += `<div class="alert alert-warning" style="font-size:13px;margin-top:8px">${c.alertas.map(esc).join('<br>')}</div>`;
      const cen = Object.entries(c.cenarios || {});
      if (cen.length) {
        const linhas = [['Parcela contratada', 'parcela_contratada'], ['Parcela revisada', 'parcela_revisada'], ['Total pago a mais', 'total_pago_a_mais'], ['Saldo contratual', 'saldo_devedor_contratual'], ['Saldo revisado', 'saldo_devedor_revisado'], ['Economia futura', 'economia_futura'], ['Economia total', 'economia_total'], ['Repetição simples', 'repeticao_simples'], ['Repetição em dobro (ref.)', 'repeticao_dobro']];

  async function rbMinuta(tipo) {
    const r = await fetch(`/api/revisao-bancaria/${rbEstado.pedido.id}/minuta/${tipo}`, { headers: { Authorization: `Bearer ${localStorage.getItem('rastreia_token')}` } });
    if (!r.ok) { const j = await r.json().catch(() => ({})); mostrarAlerta(j.erro || 'Erro ao gerar a minuta', 'error'); return; }
    const nome = ((r.headers.get('Content-Disposition') || '').match(/filename="([^"]+)"/) || [])[1] || `minuta_${tipo}.doc`;
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement('a'); a.href = url; a.download = nome; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

    const out = document.getElementById('rb-msg-cli');

    if (modo === 'whatsapp') {

  async function salvarLocacao(id) {
    const num = (elId) => { const t = document.getElementById(elId).value.replace(/[^\d,.]/g, ''); const n = t.includes(',') ? Number(t.replace(/\./g, '').replace(',', '.')) : Number(t); return Number.isFinite(n) && n > 0 ? n : null; };
    const body = { locacao_aluguel: num('loc-aluguel'), locacao_encargos: num('loc-encargos'), renda_declarada: num('loc-renda') };
    const msg = document.getElementById('loc-msg');
    const r = await fetch(`/api/pedidos/${id}/locacao`, { method: 'PATCH', headers: { Authorization: `Bearer ${localStorage.getItem('rastreia_token')}`, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const j = await r.json();
    msg.style.color = r.ok ? '#15803d' : '#b91c1c';
    msg.textContent = r.ok ? 'Salvo. Gere o PDF de novo para atualizar o veredito.' : (j.erro || 'Não foi possível salvar');
  }

  async function fazerUpgrade(pedidoId, tipo, el) {
    if (el) { el.disabled = true; el.style.pointerEvents = 'none'; el.textContent = 'Criando upgrade…'; }
    try {
      const r = await fetch(`/api/pedidos/${pedidoId}/upgrade`, { method: 'POST', headers: { Authorization: `Bearer ${localStorage.getItem('rastreia_token')}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ tipo }) });
      const j = await r.json();
      if (!r.ok || !j.id) throw new Error(j.erro || 'Não foi possível criar o upgrade');
      window.location.href = '/pedido.html?id=' + encodeURIComponent(j.id);
    } catch (e) {
      if (el) { el.disabled = false; el.style.pointerEvents = ''; el.textContent = 'Tentar de novo'; }
      const box = document.getElementById('proximo-degrau');
      if (box) box.insertAdjacentHTML('beforeend', `<div style="color:#b91c1c;font-size:13px;margin-top:8px">${esc(e.message)}</div>`);
    }
  }

  // Próximo degrau da escada (GET /api/pedidos/:id/proximo-degrau)
  async function carregarProximoDegrau(pedidoId) {
    const el = document.getElementById('proximo-degrau');
    if (!el || !pedidoId) return;
    try {
      const j = await api(`/api/pedidos/${pedidoId}/proximo-degrau`);
      const s = j && j.sugestao;
      if (!s) { el.hidden = true; return; }
      const brl = (v) => 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: Number(v) % 1 ? 2 : 0, maximumFractionDigits: 2 });
      const alvo = j.alvo || {};
      // CPF/nome vão pelo sessionStorage, não pela URL (histórico e logs do servidor)
      try { sessionStorage.setItem('rastreia_prefill_alvo', JSON.stringify({ doc: alvo.documento || '', nome: (alvo.nome && alvo.nome !== 'A identificar') ? alvo.nome : '' })); } catch (_) {}
      const link = (t) => '/novo-pedido.html?tipo=' + encodeURIComponent(t);
      const linkVeic = (t) => '/veicular.html';
      const href = (t) => t.startsWith('consulta_veicular') ? linkVeic(t) : link(t);
      // Pedido pago: upgrade cobrando só a diferença (POST /api/pedidos/:id/upgrade).
      // Ainda não pago: link para pedir o produto cheio.
      const dif = (x) => x.upgrade ? x.upgrade.diferenca : x.diferenca;
      const botao = s.upgrade
        ? `<button class="btn btn-primary" onclick="fazerUpgrade('${pedidoId}','${s.tipo}', this)">Fazer upgrade por + ${brl(dif(s))}</button>`
        : `<a class="btn btn-primary" href="${href(s.tipo)}">Pedir ${esc(s.nome)} (${brl(s.preco)})</a>`;
      const alt = !s.alternativa ? '' : (s.alternativa.upgrade
        ? `<div style="margin-top:10px;font-size:13px;color:#374151">Ou <a href="#" onclick="fazerUpgrade('${pedidoId}','${s.alternativa.tipo}', this); return false"><strong>upgrade para ${esc(s.alternativa.nome)}</strong> por + ${brl(dif(s.alternativa))}</a>: ${esc(s.alternativa.motivo)}</div>`
        : `<div style="margin-top:10px;font-size:13px;color:#374151">Ou <a href="${href(s.alternativa.tipo)}"><strong>${esc(s.alternativa.nome)}</strong> ${s.alternativa.sem_upgrade ? `(${brl(s.alternativa.preco)})` : `por mais ${brl(s.alternativa.diferenca)}`}</a>: ${esc(s.alternativa.motivo)}</div>`);
      el.innerHTML = `
        <div style="font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#1a3a8a">Próximo passo</div>
        <div style="font-size:17px;font-weight:800;margin:4px 0 8px">${esc(s.nome)} — por mais ${brl(dif(s))}</div>
        <ul style="margin:0 0 12px;padding-left:18px;font-size:14px;line-height:1.5">${s.motivos.map(m => `<li>${esc(m)}</li>`).join('')}</ul>
        ${botao}
        ${s.upgrade ? `<div style="font-size:12px;color:#4b5563;margin-top:6px">Paga só a diferença e aproveita as consultas já feitas.</div>` : ''}
        ${alt}`;
      el.hidden = false;
    } catch (_) { el.hidden = true; }
  }

  function renderAnaliseIA(p) {
    if (p.tipo !== 'due_diligence_imobiliaria') return '';
    const status = p.analise_ia_status || 'desabilitada';
    const lbl = STATUS_IA_LABEL[status] || STATUS_IA_LABEL.desabilitada;
    let analise = p.analise_ia;
    if (typeof analise === 'string') { try { analise = JSON.parse(analise); } catch { analise = null; } }
    const corSev = (s) => {
      const k = (s || '').toLowerCase();
      if (k === 'alta') return { bg: '#fee2e2', fg: '#dc2626' };
      if (k === 'media') return { bg: '#fef3c7', fg: '#ea580c' };
      return { bg: '#dcfce7', fg: '#065f46' };
    };
    const rotuloCat = (c) => ({
      proprietarios: 'Proprietários', transmissoes: 'Transmissões', onus: 'Ônus & Gravames',
      endereco: 'Endereço', documento: 'Documentos', outro: 'Outros'
    })[(c || '').toLowerCase()] || 'Outros';

    let alertasHtml = '';
    if (status === 'concluida' && analise && Array.isArray(analise.alertas) && analise.alertas.length) {
      const grupos = {};
      analise.alertas.forEach(a => {
        const k = (a.categoria || 'outro').toLowerCase();
        (grupos[k] = grupos[k] || []).push(a);
      });
      const ordem = ['proprietarios', 'transmissoes', 'onus', 'endereco', 'documento', 'outro'];
      alertasHtml = Object.keys(grupos).sort((a, b) => ordem.indexOf(a) - ordem.indexOf(b)).map(cat => {
        const lista = grupos[cat].map(a => {
          const c = corSev(a.severidade);
          return `<div style="display:flex;gap:10px;padding:10px;background:${c.bg};border-radius:6px;margin-bottom:6px">
            <span style="font-size:10px;font-weight:700;color:${c.fg};text-transform:uppercase;min-width:50px">${esc((a.severidade || '').toUpperCase())}</span>
            <div style="flex:1">
              <div style="font-weight:700;color:${c.fg};font-size:13px">${esc(a.titulo || '-')}</div>
              <div style="color:#374151;font-size:12px;margin-top:2px">${esc(a.descricao || '')}</div>
            </div>
          </div>`;
        }).join('');
        return `<div style="margin-bottom:10px">
          <div style="font-size:11px;color:#6b7280;font-weight:700;text-transform:uppercase;margin-bottom:6px">${esc(rotuloCat(cat))} (${grupos[cat].length})</div>
          ${lista}
        </div>`;
      }).join('');
    }

    const docsHtml = (status === 'concluida' && analise && Array.isArray(analise.documentos_processados) && analise.documentos_processados.length) ?
      `<details style="margin-bottom:10px"><summary style="cursor:pointer;font-size:12px;color:#6b7280">Documentos analisados (${analise.documentos_processados.length})</summary>
        <div style="margin-top:8px">
          ${analise.documentos_processados.map(d => `
            <div style="padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:12px">
              <span style="display:inline-block;padding:2px 6px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;${d.irrelevante ? 'background:#fef3c7;color:#92400e' : 'background:#dbeafe;color:#1e3a8a'}">${esc(d.tipo || '-')}${d.irrelevante ? ' (não reconhecido)' : ''}</span>
              <strong style="margin-left:6px">${esc(d.filename || '-')}</strong>
              ${d.resumo_curto ? `<span style="color:#6b7280"> · ${esc(d.resumo_curto)}</span>` : ''}
            </div>
          `).join('')}
        </div>
      </details>` : '';

    return `
      <div class="pedido-section" id="secao-analise-ia">
        <div class="section-title" style="display:flex;align-items:center;justify-content:space-between">
          <span>🤖 Análise de Documentos por IA</span>
          <span style="font-size:11px;padding:3px 10px;border-radius:12px;background:${lbl.bg};color:${lbl.cor};font-weight:700">${lbl.txt}</span>
        </div>
        ${status === 'desabilitada' ? `
          <div style="font-size:13px;color:#6b7280">Sem documentos do imóvel anexados a este pedido — a análise por IA não foi executada.</div>
        ` : ''}
        ${status === 'pendente' ? `
          <div style="font-size:13px;color:#6b7280">Análise pendente. Será executada quando as consultas automáticas rodarem.</div>
        ` : ''}
        ${status === 'falhou' ? `
          <div class="alert alert-error" style="margin:0">A análise IA falhou. Verifique se os documentos estão legíveis e tente novamente em "Executar Consultas Automáticas".</div>
        ` : ''}
        ${status === 'aguardando_extracao' ? `
          <div style="background:#dbeafe;border:1px solid #bfdbfe;border-radius:8px;padding:12px;font-size:13px;color:#1e3a8a;line-height:1.5">
            CPF/CNPJ não foi informado — a IA vai tentar extrair os proprietários dos documentos quando você rodar <strong>"Executar Consultas Automáticas"</strong>.
          </div>
        ` : ''}
        ${status === 'cpf_ilegivel' ? renderBannerCpfIlegivel(p) : ''}
        ${status === 'concluida' && analise ? `
          <div style="background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:12px;margin-bottom:12px">
            <div style="font-size:11px;color:#1e3a8a;font-weight:700;text-transform:uppercase;margin-bottom:4px">Resumo executivo</div>
            <div style="font-size:13px;color:#1e3a8a;line-height:1.5">${esc(analise.resumo_executivo || '-')}</div>
          </div>
          ${docsHtml}
          ${alertasHtml ? `<div style="font-size:11px;color:#6b7280;text-transform:uppercase;font-weight:700;margin-bottom:8px">Alertas (${analise.alertas.length})</div>${alertasHtml}` : ''}
          ${(analise.identificacao && (analise.identificacao.matricula_numero || analise.identificacao.endereco_completo)) ? `
            <details style="margin-top:10px">
              <summary style="cursor:pointer;font-size:12px;color:#6b7280">Identificação do imóvel extraída</summary>
              <div style="margin-top:8px;font-size:13px">
                ${analise.identificacao.matricula_numero ? `<div><strong>Matrícula:</strong> ${esc(analise.identificacao.matricula_numero)}</div>` : ''}
                ${analise.identificacao.cartorio ? `<div><strong>Cartório:</strong> ${esc(analise.identificacao.cartorio)}</div>` : ''}
                ${analise.identificacao.endereco_completo ? `<div><strong>Endereço:</strong> ${esc(analise.identificacao.endereco_completo)}</div>` : ''}
                ${analise.identificacao.area_total_m2 ? `<div><strong>Área Total:</strong> ${esc(analise.identificacao.area_total_m2)} m²</div>` : ''}
              </div>
            </details>
          ` : ''}
          ${(Array.isArray(analise.proprietarios) && analise.proprietarios.length) ? `
            <details style="margin-top:6px">
              <summary style="cursor:pointer;font-size:12px;color:#6b7280">Histórico de proprietários (${analise.proprietarios.length})</summary>
              <div style="margin-top:8px">
                ${analise.proprietarios.map(pr => `
                  <div style="padding:6px 0;border-bottom:1px solid #f3f4f6;font-size:13px">
                    <strong>${esc(pr.nome || '-')}</strong>${pr.atual ? ' <span style="color:#16a34a;font-size:11px">[ATUAL]</span>' : ''}
                    ${pr.tipo_aquisicao ? `<span style="color:#6b7280"> · ${esc(pr.tipo_aquisicao)}</span>` : ''}
                    ${pr.data_aquisicao ? `<span style="color:#6b7280"> · ${esc(pr.data_aquisicao)}</span>` : ''}
                  </div>
                `).join('')}
              </div>
            </details>
          ` : ''}
        ` : ''}
      </div>
    `;
  }

  function renderBannerCpfIlegivel(p) {
    const erroMsg = p.erro_processamento || 'A IA não conseguiu identificar CPF/CNPJ legível dos proprietários nos documentos enviados.';
    return `
      <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:14px;margin:0">
        <div style="display:flex;align-items:flex-start;gap:10px;margin-bottom:10px">
          <span style="font-size:20px">⚠️</span>
          <div style="flex:1">
            <div style="font-weight:700;color:#92400e;font-size:14px;margin-bottom:4px">CPF/CNPJ não identificado nos documentos</div>
            <div style="color:#78350f;font-size:13px;line-height:1.5">${esc(erroMsg)}</div>
          </div>
        </div>
        <div style="background:#fff;border:1px solid #fde68a;border-radius:6px;padding:12px;margin-top:8px">
          <div style="font-size:12px;color:#78350f;font-weight:700;margin-bottom:8px">Informe manualmente o CPF/CNPJ do proprietário:</div>
          <div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap">
            <div style="flex:1;min-width:140px">
              <label style="font-size:11px;color:#6b7280;display:block;margin-bottom:2px">Nome (opcional)</label>
              <input type="text" id="alvo-manual-nome" placeholder="Nome do proprietário" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px">
            </div>
            <div style="flex:1;min-width:140px">
              <label style="font-size:11px;color:#6b7280;display:block;margin-bottom:2px">CPF ou CNPJ *</label>
              <input type="text" id="alvo-manual-doc" placeholder="000.000.000-00" style="width:100%;padding:8px;border:1px solid #e5e7eb;border-radius:6px;font-size:13px">
            </div>
            <button class="btn btn-primary" onclick="adicionarAlvoManual()" style="padding:8px 14px;font-size:13px">Adicionar e reprocessar</button>
          </div>
          <div style="font-size:11px;color:#6b7280;margin-top:8px">Após adicionar, clique em <strong>"Executar Consultas Automáticas"</strong> para rodar as consultas.</div>
        </div>
      </div>
    `;
  }

  async function adicionarAlvoManual() {
    const nome = document.getElementById('alvo-manual-nome').value.trim();
    const documento = document.getElementById('alvo-manual-doc').value.replace(/\D/g, '');
    if (!documento || (documento.length !== 11 && documento.length !== 14)) {
      mostrarAlerta('CPF deve ter 11 dígitos ou CNPJ 14 dígitos', 'error');
      return;
    }
    const data = await api(`/api/pedidos/${id}/alvos`, {
      method: 'POST',
      body: JSON.stringify({ nome, documento })
    });
    if (data?.ok) {
      mostrarAlerta('Alvo adicionado. Clique em "Executar Consultas Automáticas" para reprocessar.', 'success');
      setTimeout(carregar, 1000);
    } else {
      mostrarAlerta('Erro: ' + (data?.erro || 'desconhecido'), 'error');
    }
  }

  async function marcarPago() {
    await api(`/api/pedidos/${id}/pago`, { method: 'PATCH', body: JSON.stringify({ mp_payment_id: 'manual' }) });
    mostrarAlerta('Pagamento confirmado!', 'success');
    setTimeout(carregar, 1000);
  }

  // Cria/recupera a preference do MP e abre o checkout. Inicia o polling em paralelo
  // pra detectar a confirmação automática quando o webhook do MP chegar.
  function formaPagamentoLabel(f) {
    if (f === 'mercadopago') return '💳 Mercado Pago (link)';
    if (f === 'dinheiro') return '💵 Dinheiro';
    if (f === 'plano') return '📦 Plano (cota mensal)';
    return f;
  }

  // Gera (ou recupera) o link MP para este pedido. Não redireciona — o link
  // é mostrado na tela para o operador enviar ao cliente.
  async function gerarLinkMP() {
    try {
      const r = await fetch(`/api/pedidos/${id}/pagamento`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.init_point) {
        mostrarAlerta(data.mensagem || data.erro || 'Não foi possível gerar o link.', 'error');
        return;
      }
      iniciarPollingPagamento();
      mostrarAlerta('Link gerado. Atualizando...', 'success');
      setTimeout(carregar, 600);
    } catch (e) {
      mostrarAlerta('Erro de conexão ao gerar link.', 'error');
    }
  }

  async function copiarLinkMP() {
    if (!pedidoAtual || !pedidoAtual.mp_init_point) return;
    try {
      await navigator.clipboard.writeText(pedidoAtual.mp_init_point);
      mostrarAlerta('Link copiado!', 'success');
    } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = pedidoAtual.mp_init_point;
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
      mostrarAlerta('Link copiado!', 'success');
    }
  }

  async function enviarEmailLinkPedido() {
    const email = document.getElementById('email-link-pedido').value.trim();
    const msg = document.getElementById('email-link-pedido-msg');
    msg.textContent = '';
    if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.style.color = '#dc2626';
      msg.textContent = 'Email inválido';
      return;
    }
    msg.style.color = '#6b7280';
    msg.textContent = 'Enviando...';
    try {
      const r = await fetch(`/api/pedidos/${id}/enviar-email-pagamento`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ email })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        msg.style.color = '#dc2626';
        msg.textContent = d.erro || d.mensagem || 'Falha ao enviar';
        return;
      }
      msg.style.color = '#16a34a';
      msg.textContent = '✓ Enviado para ' + email;
    } catch (e) {
      msg.style.color = '#dc2626';
      msg.textContent = 'Erro de conexão';
    }
  }

  // Pagamento alternativo (dinheiro / plano)
  async function pagarComForma(forma) {
    const labels = { dinheiro: 'em dinheiro', plano: 'cobrando do plano' };
    if (!confirm(`Confirmar pagamento ${labels[forma]}?`)) return;
    try {
      const r = await fetch(`/api/pedidos/${id}/pagamento-alternativo`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ forma })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) {
        mostrarAlerta(d.erro || 'Falha ao registrar pagamento', 'error');
        return;
      }
      let extra = '';
      if (forma === 'plano' && d.plano_restantes != null) extra = ` (restam ${d.plano_restantes} no plano)`;
      mostrarAlerta('Pagamento registrado' + extra + '. Atualizando...', 'success');
      setTimeout(carregar, 800);
    } catch (e) {
      mostrarAlerta('Erro de conexão', 'error');
    }
  }

  // Polling pós-redirect: consulta o status a cada 3s por até 2 min para pegar
  // a confirmação automática do webhook (PDF é gerado em background).
  let pollingTimer = null;
  let pollingTries = 0;
  function iniciarPollingPagamento() {
    if (pollingTimer) return;
    pollingTries = 0;
    pollingTimer = setInterval(async () => {
      pollingTries++;
      if (pollingTries > 40) { clearInterval(pollingTimer); pollingTimer = null; return; }
      try {
        const r = await fetch(`/api/pedidos/${id}/pagamento/status`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (!r.ok) return;
        const s = await r.json();
        if (s.status && s.status !== 'aguardando_pagamento') {
          clearInterval(pollingTimer); pollingTimer = null;
          mostrarAlerta('Pagamento confirmado! Atualizando...', 'success');
          setTimeout(carregar, 800);
        }
      } catch (_) { /* tenta de novo */ }
    }, 3000);
  }

  // Auto-polling: se há link MP gerado e pedido ainda aguarda, espera o webhook.
  if (typeof window !== 'undefined') {
    setTimeout(() => {
      if (pedidoAtual && pedidoAtual.status === 'aguardando_pagamento' && pedidoAtual.mp_init_point) {
        iniciarPollingPagamento();
      }
    }, 1500);
  }

  async function iniciar() {
    await api(`/api/pedidos/${id}/iniciar`, { method: 'PATCH', body: '{}' });
    mostrarAlerta('Análise iniciada!', 'success');
    setTimeout(carregar, 1000);
  }

  async function executarConsultas() {
    consultasEmAndamento = true;
    const btnConsultar = document.getElementById('btn-consultar');
    if (btnConsultar) {
      btnConsultar.textContent = '⏳ Consultando... aguarde';
      btnConsultar.disabled = true;
    }
    mostrarAlerta('Executando consultas automáticas nas bases de dados...', 'info');
    try {
      const data = await api(`/api/pedidos/${id}/consultar`, { method: 'POST', body: '{}' });
      if (data?.ok) {
        mostrarAlerta('Consultas concluídas! Verifique os dados abaixo.', 'success');
        setTimeout(carregar, 1500);
      } else if (data?.erro === 'cpf_ilegivel') {
        mostrarAlerta(data.mensagem || 'IA não extraiu CPF dos documentos. Informe manualmente abaixo.', 'error');
        setTimeout(carregar, 800);
      } else {
        mostrarAlerta('Erro nas consultas: ' + (data?.erro || 'Desconhecido'), 'error');
      }
    } finally {
      consultasEmAndamento = false;
    }
  }

  function mostrarFinalizacao() {
    document.getElementById('finalizacao').style.display = 'block';
    document.getElementById('finalizacao').scrollIntoView({ behavior: 'smooth' });
  }

  async function concluir() {
    if (consultasEmAndamento) {
      mostrarAlerta('Aguarde as consultas automáticas terminarem antes de gerar o PDF.', 'error');
      return;
    }
    const observacoes = document.getElementById('observacoes').value;
    mostrarAlerta('Gerando PDF...', 'info');
    const data = await api(`/api/pedidos/${id}/concluir`, { method: 'POST', body: JSON.stringify({ observacoes }) });
    if (data?.ok) {
      mostrarAlerta('✅ Relatório gerado e cliente notificado!', 'success');
      setTimeout(carregar, 1500);
    } else if (data?.erro === 'cpf_ilegivel') {
      mostrarAlerta(data.mensagem || 'CPF ilegível — informe manualmente o alvo antes de concluir.', 'error');
      setTimeout(carregar, 800);
    } else {
      mostrarAlerta('Erro: ' + (data?.erro || 'Desconhecido'), 'error');
    }
  }

  function mostrarAlerta(msg, tipo) {
    const el = document.getElementById('alerta');
    if (el) el.innerHTML = `<div class="alert alert-${tipo}">${esc(msg)}</div>`;
    window.scrollTo(0, 0);
  }

  function logout() { localStorage.clear(); window.location.href = '/'; }

  async function carregarCusto(p) {
    const el = document.getElementById('custo-conteudo');
    if (!el) return;
    try {
      const data = await api(`/api/admin/custos/pedido/${id}`);
      if (!data || data.erro) { el.innerHTML = '<div style="font-size:12px;color:#6b7280">Sem dados de custo</div>'; return; }
      const total = Number(data.total_brl || 0);
      const valor = Number(p.valor || 0);
      const margem = valor > 0 ? ((valor - total) / valor * 100) : 0;
      const lucro = valor - total;
      const breakdown = (data.breakdown || []).map(b => `
        <div style="display:flex;justify-content:space-between;padding:4px 0;font-size:12px;border-bottom:1px solid #f3f4f6">
          <span>${esc(b.fonte)} <span style="color:#9ca3af">· ${esc(b.api)}</span></span>
          <span style="font-variant-numeric:tabular-nums">R$ ${Number(b.valor_brl).toLocaleString('pt-BR',{minimumFractionDigits:2})}</span>
        </div>`).join('');
      el.innerHTML = `
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:10px">
          <div><div style="font-size:10px;color:#6b7280;text-transform:uppercase">Custo APIs</div><div style="font-size:18px;font-weight:700;color:#dc2626">R$ ${total.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
          <div><div style="font-size:10px;color:#6b7280;text-transform:uppercase">Venda</div><div style="font-size:18px;font-weight:700;color:#111">R$ ${valor.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
          <div><div style="font-size:10px;color:#6b7280;text-transform:uppercase">Margem</div><div style="font-size:18px;font-weight:700;color:${margem>=70?'#16a34a':margem>=40?'#ea580c':'#dc2626'}">${margem.toFixed(1)}%</div><div style="font-size:11px;color:#6b7280">Lucro: R$ ${lucro.toLocaleString('pt-BR',{minimumFractionDigits:2})}</div></div>
        </div>
        ${breakdown ? `<details style="margin-top:6px"><summary style="cursor:pointer;font-size:12px;color:#6b7280">Detalhamento (${data.breakdown.length} APIs consultadas)</summary><div style="margin-top:6px">${breakdown}</div></details>` : '<div style="font-size:12px;color:#6b7280">Nenhuma consulta registrada ainda.</div>'}
      `;
    } catch (e) {
      el.innerHTML = '<div style="font-size:12px;color:#dc2626">Erro ao calcular custo</div>';
    }
  }

  carregar();
</script>
</body>
</html>
